<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasklike Player</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2028%2028%22%20width%3D%2228%22%20height%3D%2228%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%235ca7ff%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%231a52a3%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2228%22%20height%3D%2228%22%20rx%3D%229%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Cpath%20d%3D%22M9%206.2v15.6L21%2014%209%206.2z%22%20fill%3D%22%23041226%22%2F%3E%3C%2Fsvg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d10;
      --pane: #161a20;
      --pane-2: #1b2028;
      --header: rgba(18, 21, 26, .82);
      --line: rgba(255, 255, 255, .07);
      --line-strong: rgba(255, 255, 255, .12);
      --text: #eef2f6;
      --text-2: #c5ccd6;
      --muted: #8b95a3;
      --teal: #5ca7ff;
      --teal-soft: rgba(92, 167, 255, .16);
      --next: #9fd0ff;
      --next-soft: rgba(159, 208, 255, .14);
      --warn-bg: #2a2412;
      --warn-text: #f3e2a0;
      --danger: #ff8b8b;
      --shadow: 0 18px 50px rgba(0, 0, 0, .38);
      --radius: 16px;
      --control-h: 36px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background:
        radial-gradient(1200px 500px at 12% -10%, rgba(92, 167, 255, .10), transparent 50%),
        radial-gradient(900px 420px at 100% 0%, rgba(88, 120, 255, .08), transparent 46%),
        var(--bg);
      color: var(--text);
      font-family: Outfit, "Segoe UI", sans-serif;
      font-size: 14px;
    }
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    button, input, select { font-family: inherit; font-size: 13px; }
    button {
      background: var(--pane-2); border: 1px solid var(--line-strong); color: var(--text-2);
      padding: 0 12px; height: var(--control-h); border-radius: 999px; cursor: pointer;
      letter-spacing: .01em; display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; transition: background .15s ease, color .15s ease, border-color .15s ease, transform .12s ease;
      white-space: nowrap;
    }
    button:hover { background: #242a33; color: var(--text); border-color: rgba(92, 167, 255, .32); }
    button:active { transform: translateY(1px); }
    button.active { background: var(--teal-soft); border-color: rgba(92, 167, 255, .45); color: var(--teal); }
    button.icon-btn { width: var(--control-h); padding: 0; min-width: var(--control-h); }
    .titlebar {
      background: var(--header); backdrop-filter: blur(18px); border-bottom: 1px solid var(--line);
      padding: 8px 12px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo-mark {
      width: 28px; height: 28px; border-radius: 9px;
      background: linear-gradient(160deg, #5ca7ff, #1a52a3);
      display: grid; place-items: center; color: #041226; flex-shrink: 0;
      box-shadow: 0 0 18px rgba(92, 167, 255, .32);
    }
    .titlebar h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
    .titlebar .status {
      margin-left: auto; font-family: "IBM Plex Mono", monospace; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px;
      background: rgba(255,255,255,.03); border: 1px solid var(--line);
      border-radius: 999px; padding: 6px 12px; max-width: 58%;
    }
    .toolbar {
      padding: 6px 10px 8px; display: flex; align-items: center; gap: 6px;
      flex-wrap: wrap; flex-shrink: 0;
    }
    .toolbar select, .search-wrap input, dialog input, #speed {
      background: #0e1116; color: var(--text); border: 1px solid var(--line-strong);
      border-radius: 999px; padding: 0 12px; height: var(--control-h);
    }
    .toolbar select { min-width: 180px; color: var(--teal); }
    .search-wrap {
      margin-left: auto; display: flex; align-items: center; gap: 8px;
      color: var(--muted); font-size: 12px; font-weight: 500;
    }
    .search-wrap input { width: 240px; }
    .search-wrap input:focus, .toolbar select:focus, dialog input:focus,
    #progress:focus, #volume:focus, #speed:focus {
      outline: 2px solid rgba(92, 167, 255, .32); outline-offset: 1px;
    }
    #warn-banner {
      display: none; margin: 0; background: var(--warn-bg); color: var(--warn-text);
      padding: 6px 12px; align-items: center; justify-content: space-between;
      gap: 10px; flex-shrink: 0; border: 1px solid rgba(243, 226, 160, .18);
    }
    #warn-banner.visible { display: flex; }
    #warn-banner button { height: 28px; padding: 0 10px; }
    .layout {
      flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 360px;
      min-height: 0; gap: 0; padding: 0;
    }
    .player-column, .queue-panel {
      min-width: 0; min-height: 0; display: flex; flex-direction: column;
      background: var(--pane); border: 0; border-radius: 0; overflow: hidden; box-shadow: none;
    }
    .player-column { border-right: 1px solid var(--line); }
    .queue-panel { border-left: 1px solid var(--line); }
    .player-frame { flex: 1; min-height: 0; background: #000; }
    #player { width: 100%; height: 100%; background: #000; }
    .now-playing-card {
      display: grid; grid-template-columns: 72px 1fr auto; gap: 8px; align-items: center;
      padding: 8px 10px; background: linear-gradient(180deg, #1a1f27, #14181e);
      border-top: 1px solid var(--line); flex-shrink: 0;
    }
    .now-playing-card img {
      width: 72px; height: 40px; object-fit: cover; background: #000;
      border-radius: 8px; border: 1px solid var(--line-strong);
    }
    .now-meta .label { font-size: 10px; color: var(--teal); font-weight: 700; letter-spacing: .16em; }
    .now-meta h2 { margin: 3px 0 2px; font-size: 17px; font-weight: 600; line-height: 1.25; }
    .now-meta .sub { font-family: "IBM Plex Mono", monospace; color: var(--muted); font-size: 12px; }
    .now-actions { display: flex; gap: 6px; }
    .queue-head {
      padding: 14px 14px 10px; display: flex; align-items: flex-end;
      justify-content: space-between; gap: 12px; flex-shrink: 0;
    }
    .queue-head h3 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--muted); }
    .queue-head .count { font-family: "IBM Plex Mono", monospace; color: var(--teal); font-size: 12px; }
    .queue-cols {
      display: grid; grid-template-columns: 44px 54px 1fr 40px; gap: 0;
      padding: 0 12px 8px; color: var(--muted); font-size: 11px;
      letter-spacing: .08em; text-transform: uppercase; flex-shrink: 0;
    }
    .queue-list { overflow: auto; flex: 1; padding: 0 8px 10px; }
    .q-item {
      display: grid; grid-template-columns: 44px 54px 1fr 32px; gap: 0;
      align-items: center; padding: 8px; cursor: grab; user-select: none;
      border-radius: 12px; margin-bottom: 4px; border: 1px solid transparent;
      transition: background .15s ease, border-color .15s ease;
    }
    .q-item:hover { background: rgba(255,255,255,.04); }
    .q-item.playing { background: var(--teal-soft); border-color: rgba(92, 167, 255, .22); }
    .q-item.next-up { background: var(--next-soft); border-color: rgba(214, 255, 106, .16); }
    .q-item.gone { opacity: .45; }
    .q-item.dragging { opacity: .45; }
    .q-step { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
    .q-item.playing .q-step { color: var(--teal); }
    .q-item.next-up .q-step { color: var(--next); }
    .q-item img { width: 48px; height: 27px; object-fit: cover; background: #000; border-radius: 6px; border: 1px solid var(--line); }
    .q-title { padding-left: 10px; font-size: 13px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-orig { font-family: "IBM Plex Mono", monospace; color: var(--muted); font-size: 11px; padding-left: 10px; }
    .q-remove { width: 28px; height: 28px; min-width: 28px; padding: 0; opacity: 0; background: transparent; border: 0; color: var(--muted); }
    .q-item:hover .q-remove, .q-item:focus-within .q-remove { opacity: 1; }
    .q-remove:hover { color: var(--danger); }
    .empty-queue { color: var(--muted); padding: 36px 20px; text-align: center; line-height: 1.5; }
    .empty-queue strong { display: block; color: var(--text); margin-bottom: 8px; font-size: 15px; }
    .bottom-bar {
      margin: 0; background: var(--pane); border: 1px solid var(--line); border-radius: 0;
      border-left: 0; border-right: 0; border-bottom: 0; padding: 8px 12px 9px; flex-shrink: 0;
    }
    .progress-row { display: grid; grid-template-columns: 56px 1fr 56px; gap: 10px; align-items: center; margin-bottom: 10px; }
    .time { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--teal); font-variant-numeric: tabular-nums; }
    .time.right { text-align: right; }
    #progress, #volume {
      -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
      border-radius: 999px; background: #2a313b; border: 0; outline: none;
    }
    #progress::-webkit-slider-thumb, #volume::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px; background: var(--teal);
      border: 0; border-radius: 50%; cursor: pointer; box-shadow: 0 0 0 4px rgba(92, 167, 255, .18);
    }
    .controls-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .transport { display: flex; align-items: center; gap: 6px; }
    .transport button { min-width: 44px; height: 38px; }
    #btn-play { min-width: 88px; font-weight: 700; background: var(--teal); color: #062016; border-color: transparent; }
    #btn-play:hover { background: #73ffc9; color: #062016; }
    .volume-wrap, .speed-wrap { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 500; }
    .volume-wrap { min-width: 188px; }
    #volume { width: 108px; }
    #speed { width: 72px; padding: 0 8px; color: var(--teal); }
    #vol-label { width: 40px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--teal); font-variant-numeric: tabular-nums; }
    .keys-hint { color: var(--muted); font-size: 11px; max-width: 280px; }
    .hidden-file { display: none; }
    dialog { background: #171b21; color: var(--text); border: 1px solid var(--line-strong); border-radius: 18px; padding: 18px; width: min(400px, 92vw); box-shadow: var(--shadow); }
    dialog::backdrop { background: rgba(0,0,0,.72); }
    dialog h3 { margin: 0 0 8px; font-size: 16px; }
    dialog input { width: 100%; margin: 10px 0 14px; }
    #drop-overlay {
      display: none; position: fixed; inset: 0; background: rgba(6, 16, 12, .72);
      border: 2px dashed var(--teal); z-index: 40; place-items: center;
      color: var(--teal); font-size: 22px; font-weight: 650; letter-spacing: .04em;
    }
    #drop-overlay.visible { display: grid; }
    #toast {
      position: fixed; right: 18px; bottom: 18px; background: #1c222b; border: 1px solid var(--line-strong);
      color: var(--text); padding: 10px 14px; border-radius: 12px; z-index: 50;
      opacity: 0; pointer-events: none; transform: translateY(8px);
      transition: opacity .2s ease, transform .2s ease; max-width: min(360px, calc(100vw - 36px));
    }
    #toast.visible { opacity: 1; transform: none; }
    @media (max-width: 980px) {
      body { overflow: auto; height: auto; min-height: 100vh; }
      .layout { grid-template-columns: 1fr; }
      .player-frame { min-height: 220px; aspect-ratio: 16 / 9; flex: none; }
      .queue-panel { min-height: 280px; }
      .keys-hint { display: none; }
      .search-wrap { margin-left: 0; width: 100%; }
      .search-wrap input { width: 100%; }
      .titlebar { flex-wrap: wrap; }
      .titlebar .status { max-width: 100%; margin-left: 0; }
      .controls-row { flex-wrap: wrap; }
    }
    html[data-theme="classic"] {
      --bg: #121212; --pane: #161616; --pane-2: #242424; --header: #1a1a1a;
      --line: #000; --line-strong: #3a3a3a; --text: #d8d8d8; --text-2: #cfcfcf;
      --muted: #7a8898; --teal: #5ca7ff; --teal-soft: #0d1a2e; --next: #9fd0ff;
      --next-soft: #0c1622; --warn-bg: #2a2208; --warn-text: #e6d48a;
      --shadow: none; --radius: 1px; --control-h: 26px;
    }
    html[data-theme="classic"] html, html[data-theme="classic"],
    html[data-theme="classic"] body { background: var(--bg); color: var(--text); font-family: Rajdhani, "Segoe UI", sans-serif; }
    html[data-theme="classic"] button, html[data-theme="classic"] input,
    html[data-theme="classic"] select { font-size: 12px; }
    html[data-theme="classic"] button {
      background: #242424; border: 1px solid #3a3a3a; border-top-color: #555;
      border-left-color: #444; color: #cfcfcf; padding: 5px 10px; height: auto;
      min-height: 26px; border-radius: 1px; text-transform: uppercase; letter-spacing: .04em;
    }
    html[data-theme="classic"] button:hover { background: #2c2c2c; color: var(--teal); border-color: #3a3a3a; }
    html[data-theme="classic"] button.active {
      background: #0d1a2e; border-color: #1a52a3; color: var(--teal);
      box-shadow: inset 0 0 8px rgba(92, 167, 255, .18);
    }
    html[data-theme="classic"] .titlebar { background: #1a1a1a; backdrop-filter: none; border-bottom: 1px solid #000; padding: 6px 10px; }
    html[data-theme="classic"] .logo-mark { width: 18px; height: 18px; border-radius: 1px; box-shadow: none; }
    html[data-theme="classic"] .titlebar h1 { font-size: 15px; font-weight: 700; letter-spacing: .12em; color: var(--teal); }
    html[data-theme="classic"] .titlebar .status { margin-left: auto; font-family: "Share Tech Mono", monospace; background: transparent; border: 0; border-radius: 0; padding: 0; color: var(--muted); }
    html[data-theme="classic"] .toolbar { background: #1c1c1c; border-bottom: 1px solid #000; padding: 6px 8px; gap: 6px; }
    html[data-theme="classic"] .toolbar select, html[data-theme="classic"] .search-wrap input,
    html[data-theme="classic"] dialog input, html[data-theme="classic"] #speed {
      background: #0d0d0d; color: var(--teal); border: 1px solid #333; border-radius: 1px; height: 26px; font-family: "Share Tech Mono", monospace;
    }
    html[data-theme="classic"] .search-wrap { text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
    html[data-theme="classic"] #warn-banner { margin: 0; border-radius: 0; border: 0; border-bottom: 1px solid #000; padding: 5px 10px; }
    html[data-theme="classic"] .layout { gap: 0; padding: 0; grid-template-columns: minmax(0, 1fr) 360px; }
    html[data-theme="classic"] .player-column, html[data-theme="classic"] .queue-panel { background: #000; border: 0; border-radius: 0; box-shadow: none; }
    html[data-theme="classic"] .player-column { border-right: 1px solid #000; }
    html[data-theme="classic"] .queue-panel { background: #161616; border-left: 1px solid #000; }
    html[data-theme="classic"] .player-frame { box-shadow: inset 0 0 0 1px #222; }
    html[data-theme="classic"] .now-playing-card { grid-template-columns: 72px 1fr auto; gap: 8px; padding: 8px 10px; background: #141414; border-top: 1px solid #000; box-shadow: inset 0 1px 0 #2a2a2a; }
    html[data-theme="classic"] .now-playing-card img { width: 72px; height: 40px; border-radius: 0; border: 1px solid #333; }
    html[data-theme="classic"] .now-meta .label, html[data-theme="classic"] .now-meta .sub,
    html[data-theme="classic"] .queue-head .count, html[data-theme="classic"] .q-step,
    html[data-theme="classic"] .q-orig, html[data-theme="classic"] .time,
    html[data-theme="classic"] #vol-label { font-family: "Share Tech Mono", monospace; }
    html[data-theme="classic"] .now-meta h2 { margin: 1px 0; font-size: 16px; }
    html[data-theme="classic"] .queue-head { padding: 7px 10px; background: #1a1a1a; border-bottom: 1px solid #000; }
    html[data-theme="classic"] .queue-head h3 { color: var(--teal); }
    html[data-theme="classic"] .queue-cols { padding: 4px 8px; background: #101010; color: #5ca7ff; border-bottom: 1px solid #000; }
    html[data-theme="classic"] .queue-list { padding: 0; }
    html[data-theme="classic"] .q-item { grid-template-columns: 44px 54px 1fr 32px; padding: 4px 8px; border-radius: 0; margin: 0; border: 0; border-bottom: 1px solid #1e1e1e; }
    html[data-theme="classic"] .q-item:nth-child(even) { background: #141414; }
    html[data-theme="classic"] .q-item:hover { background: #242424; }
    html[data-theme="classic"] .q-item.playing { background: #0c2418; box-shadow: inset 3px 0 0 var(--teal); border-color: transparent; }
    html[data-theme="classic"] .q-item.next-up { background: #1a220c; box-shadow: inset 3px 0 0 var(--next); border-color: transparent; }
    html[data-theme="classic"] .q-item img { border-radius: 0; border: 1px solid #2a2a2a; }
    html[data-theme="classic"] .q-title, html[data-theme="classic"] .q-orig { padding-left: 8px; }
    html[data-theme="classic"] .bottom-bar { margin: 0; background: linear-gradient(#222, #161616); border: 0; border-top: 1px solid #000; border-radius: 0; box-shadow: inset 0 1px 0 #333; padding: 8px 10px 7px; }
    html[data-theme="classic"] #progress, html[data-theme="classic"] #volume { height: 8px; border-radius: 0; background: #0a0a0a; border: 1px solid #333; }
    html[data-theme="classic"] #progress::-webkit-slider-thumb, html[data-theme="classic"] #volume::-webkit-slider-thumb { width: 10px; height: 16px; border-radius: 0; background: var(--teal); border: 1px solid #0a5; box-shadow: 0 0 6px rgba(92, 167, 255, .5); }
    html[data-theme="classic"] .time { text-shadow: 0 0 6px rgba(92, 167, 255, .35); }
    html[data-theme="classic"] .transport button { min-width: 40px; height: 30px; }
    html[data-theme="classic"] #btn-play { min-width: 58px; background: #1a1a1a; color: var(--teal); border-color: #3a3a3a; }
    html[data-theme="classic"] #btn-play:hover { background: #2c2c2c; color: var(--teal); }
    html[data-theme="classic"] .volume-wrap, html[data-theme="classic"] .speed-wrap { text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
    html[data-theme="classic"] dialog { background: #1a1a1a; border: 1px solid #333; border-radius: 1px; box-shadow: none; }
    html[data-theme="classic"] dialog h3 { color: var(--teal); font-size: 14px; }
    html[data-theme="classic"] #toast { right: 10px; bottom: 10px; background: #1a1a1a; border: 1px solid #333; border-radius: 1px; }
    html[data-theme="classic"] #drop-overlay { border-radius: 0; }
  </style>
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <div class="logo-mark" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M3 2.2v9.6L12 7 3 2.2z"/></svg>
      </div>
      <h1>Tasklike Player</h1>
    </div>
    <div class="status" id="status">Loading…</div>
  </header>
  <div class="toolbar">
    <select id="playlist-select" title="Saved playlists"></select>
    <button id="btn-save-as">Save</button>
    <button id="btn-delete-pl" title="Delete the selected saved playlist">Delete save</button>
    <button id="btn-hide-gone" class="active">Hide gone</button>
    <button id="btn-fullscreen">Fullscreen</button>
    <button id="btn-theme" title="Switch between modern and classic look">Classic</button>
    <div class="search-wrap">
      <span>Search</span>
      <input id="search" type="search" placeholder="Title or number" autocomplete="off">
    </div>
  </div>
  <div id="warn-banner">
    <span id="warn-text"></span>
    <button id="warn-dismiss">Dismiss</button>
  </div>
  <main class="layout">
    <section class="player-column">
      <div class="player-frame" id="player-frame"><div id="player"></div></div>
      <div class="now-playing-card">
        <img id="now-art" alt="" src="">
        <div class="now-meta">
          <div class="label">NOW PLAYING</div>
          <h2 id="now-title">Nothing playing</h2>
          <div class="sub" id="now-sub">Load a playlist to start</div>
        </div>
        <div class="now-actions">
          <button id="btn-open-yt" title="Open this video on YouTube">YouTube</button>
        </div>
      </div>
    </section>
    <aside class="queue-panel">
      <div class="queue-head">
        <h3>GUIDE / QUEUE</h3>
        <div class="count" id="queue-count">0 / 0</div>
      </div>
      <div class="queue-cols">
        <span>Step</span><span></span><span>Title</span><span></span>
      </div>
      <div class="queue-list" id="queue-list"></div>
    </aside>
  </main>
  <footer class="bottom-bar">
    <div class="progress-row">

    function lockPlayerFocus() { const ifr = $("player-frame")?.querySelector("iframe"); if (ifr) { ifr.setAttribute("tabindex", "-1"); ifr.style.pointerEvents = "none"; } window.focus(); }
    function seekBy(s) { if (!state.playerReady || !state.player) return; const t = Math.max(0, (state.currentTime || 0) + s); state.player.seekTo(t, true); state.currentTime = t; }
    function applyPlaybackRate() { if (state.playerReady && state.player?.setPlaybackRate) try { state.player.setPlaybackRate(state.playbackRate); } catch (_) {} }

    /* ── Media Session ──────────────────────────────────── */
    function bindMediaSession() {
      if (!("mediaSession" in navigator)) return;
      const set = (a, fn) => { try { navigator.mediaSession.setActionHandler(a, fn); } catch (_) {} };
      set("play", () => { if (state.playerReady && state.player) state.player.playVideo(); });
      set("pause", () => { if (state.playerReady && state.player) state.player.pauseVideo(); });
      set("previoustrack", () => playPrev()); set("nexttrack", () => playNext());
      set("seekbackward", d => seekBy(-(d?.seekOffset || 10))); set("seekforward", d => seekBy(d?.seekOffset || 10));
      set("seekto", d => { if (d?.seekTime == null || !state.playerReady) return; state.player.seekTo(d.seekTime, true); state.currentTime = d.seekTime; });
      const v = currentVideo(); if (v) updateMediaSession(v); updatePositionState();
    }
    function ensureSessionAudio() { if (sessionAudio) return sessionAudio; sessionAudio = new Audio(); sessionAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"; sessionAudio.loop = true; sessionAudio.volume = 0.01; sessionAudio.setAttribute("playsinline", "true"); return sessionAudio; }
    function syncSessionAudio() { const a = ensureSessionAudio(); if (state.playing) a.play().catch(() => {}); else a.pause(); }
    function startMediaSessionKeeper() { bindMediaSession(); syncSessionAudio(); clearInterval(mediaSessionTimer); mediaSessionTimer = setInterval(() => { bindMediaSession(); syncSessionAudio(); }, 400); }
    function updateMediaSession(video) {
      if (!("mediaSession" in navigator) || !video) return;
      try { navigator.mediaSession.metadata = new MediaMetadata({ title: video.title || video.video_id, artist: video.author || state.playlistName || "Playlist", artwork: [{ src: thumbUrl(video.video_id), sizes: "480x360", type: "image/jpeg" }] }); navigator.mediaSession.playbackState = state.playing ? "playing" : "paused"; } catch (_) {}
    }
    function updatePositionState() { if (!("mediaSession" in navigator) || !state.duration) return; try { navigator.mediaSession.setPositionState({ duration: state.duration, playbackRate: state.playbackRate || 1, position: Math.min(Math.max(0, state.currentTime), state.duration) }); } catch (_) {} }

    /* ── Theme ───────────────────────────────────────────── */
    function applyTheme() { const t = state.theme === "classic" ? "classic" : "modern"; document.documentElement.setAttribute("data-theme", t); const b = $("btn-theme"); if (b) b.textContent = t === "classic" ? "Modern" : "Classic"; }
    function toggleTheme() { state.theme = state.theme === "classic" ? "modern" : "classic"; applyTheme(); schedulePersist(); }
    function applyChrome() {
      applyTheme();
      $("btn-shuffle").classList.toggle("active", state.shuffle);
      $("btn-loop").classList.toggle("active", state.loopCurrent);
      $("btn-hide-gone").classList.toggle("active", state.hideGone);
      $("btn-mute").classList.toggle("active", state.muted || state.volume === 0);
      $("btn-mute").textContent = (state.muted || state.volume === 0) ? "Unmute" : "Mute";
      $("volume").value = String(volumeToSlider(state.volume));
      $("vol-label").textContent = Math.round(state.volume) + "%";
      $("speed").value = String(state.playbackRate);
      $("btn-play").textContent = state.playing ? "Pause" : "Play";
      if ("mediaSession" in navigator) navigator.mediaSession.playbackState = state.playing ? "playing" : "paused";
    }

    /* ── Playback ────────────────────────────────────────── */
    function cueCurrent() { loadCurrentVideo(false); }
    function playCurrent(forceLoad) { loadCurrentVideo(true, forceLoad); }
    function loadCurrentVideo(shouldPlay, forceLoad) {
      const video = currentVideo(); if (!video) return;
      pendingPlay = !!shouldPlay; pendingVideoId = video.video_id;
      renderNowPlaying(); renderQueue(); updateStatus(); applyChrome(); schedulePersist();
      if (!ytApiReady) { loadYouTubeApi(); return; }
      if (!state.player) { createPlayer(video.video_id, shouldPlay); return; }
      if (!state.playerReady) return;
      state.player.setVolume(state.volume); applyPlaybackRate();
      if (shouldPlay) { if (forceLoad !== false) syncQueueToYouTube(state.currentTime || 0); else state.player.playVideo(); return; }
      ytPlaylistSig = video.video_id; state.player.cueVideoById({ videoId: video.video_id, startSeconds: state.currentTime || 0 });
    }
    function syncQueueToYouTube(startSeconds) {
      if (startSeconds === undefined) startSeconds = 0;
      if (!state.playerReady || !state.player) return;
      const video = currentVideo(); if (!video?.video_id) return;
      const sig = video.video_id;
      if (ytPlaylistSig !== sig) { ytPlaylistSig = sig; state.player.loadVideoById({ videoId: video.video_id, startSeconds: startSeconds || 0 }); return; }
      state.player.seekTo(startSeconds || 0, true); state.player.playVideo();
    }
    function createPlayer(videoId, shouldPlay) {
      state.player = new YT.Player("player", {
        width: "100%", height: "100%", videoId,
        playerVars: { autoplay: 1, rel: 0, modestbranding: 1, playsinline: 1, disablekb: 1, start: Math.floor(state.currentTime || 0) },
        events: {
          onReady: event => {
            state.playerReady = true; lockPlayerFocus(); startMediaSessionKeeper();
            event.target.setVolume(state.volume); applyPlaybackRate();
            const video = currentVideo(); ytPlaylistSig = video?.video_id || videoId || "";
            if (pendingPlay || shouldPlay) syncQueueToYouTube(state.currentTime || 0);
            else if (video?.video_id) event.target.cueVideoById({ videoId: video.video_id, startSeconds: state.currentTime || 0 });
          },
          onStateChange: event => {
            if (event.data === YT.PlayerState.ENDED) { if (state.loopCurrent) { event.target.seekTo(0, true); event.target.playVideo(); } else handleTrackEnded(); }
            if (event.data === YT.PlayerState.PLAYING) { state.playing = true; applyPlaybackRate(); applyChrome(); startTicker(); startMediaSessionKeeper(); capturePlayerMeta(); }
            if (event.data === YT.PlayerState.PAUSED) { state.playing = false; applyChrome(); syncSessionAudio(); }
          },
          onError: event => { markUnavailable(currentVideo()?.video_id, "error " + event.data); playNext(); }
        }
      });
    }
    function startTicker() {
      clearInterval(tickTimer);
      tickTimer = setInterval(() => {
        if (!state.playerReady || !state.player || state.seeking) return;
        try { const t = state.player.getCurrentTime() || 0, d = state.player.getDuration() || 0; state.currentTime = t; state.duration = d; $("time-cur").textContent = formatTime(t); $("time-dur").textContent = formatTime(d); if (d > 0) $("progress").value = String(Math.round((t / d) * 1000)); updatePositionState(); capturePlayerMeta(); } catch (_) {}
      }, 250);
    }
    function handleTrackEnded() { if (state.queuePos >= state.queue.length - 1) { createQueue(); state.queuePos = 0; state.currentTime = 0; playCurrent(true); return; } playNext(); }
    function togglePlay() { if (!state.playerReady || !state.player) { playCurrent(true); return; } const st = state.player.getPlayerState(); if (st === YT.PlayerState.PLAYING) state.player.pauseVideo(); else state.player.playVideo(); }
    function playNext() {
      if (!state.queue.length) return;
      if (state.loopCurrent) { state.currentTime = 0; playCurrent(true); return; }
      state.queuePos += 1; if (state.queuePos >= state.queue.length) { createQueue(); state.queuePos = 0; }
      state.currentTime = 0; playCurrent(true);
    }
    function playPrev() {
      if (!state.queue.length) return;
      if (state.currentTime > 3 && state.playerReady) { state.player.seekTo(0, true); state.currentTime = 0; return; }
      state.queuePos -= 1; if (state.queuePos < 0) state.queuePos = state.queue.length - 1;
      state.currentTime = 0; playCurrent(true);
    }
    function toggleShuffle() { state.shuffle = !state.shuffle; createQueue(currentOrigIndex()); applyChrome(); renderQueue(); renderNowPlaying(); schedulePersist(); showToast(state.shuffle ? "Shuffle on" : "Playing in playlist order"); }
    function capturePlayerMeta() {
      if (!state.playerReady || !state.player?.getVideoData) return; const video = currentVideo(); if (!video) return;
      let info = null; try { info = state.player.getVideoData(); } catch (_) { return; }
      if (!info?.video_id || info.video_id !== video.video_id) return;
      const title = String(info.title || "").trim(), author = String(info.author || "").trim();
      let changed = false;
      if (title && video.title !== title) { video.title = title; changed = true; }
      if (author && video.author !== author) { video.author = author; changed = true; }
      if (!changed) return;
      if (video.video_id) { state.titleCache[video.video_id] = { title: video.title || "", author: video.author || "" }; saveTitleCache(); }
      schedulePersist(); renderNowPlaying(); renderQueue(); updateMediaSession(video);
    }

    /* ── Playlist loading ────────────────────────────────── */
    function normalizeVideos(data) {
      const list = Array.isArray(data) ? data : (data.videos || data.items || []);
      return list.map((item, i) => ({ video_id: item.video_id || item.id || item.videoId || item.snippet?.resourceId?.videoId || "", title: "", author: "", url: item.url || item.link || item.webpage_url || "" })).filter(v => v.video_id);
    }
    function applyPlaylist(data, name, restoreQueue) {
      const videos = normalizeVideos(data);
      if (!videos.length) { showToast("That file did not contain any videos."); return false; }
      state.videos = videos; state.playlistName = name || "Playlist";
      state.playlistUrl = playlistUrlFromData(data, name) || playlistUrlFromData(videos, name) || "";
      state.unavailable = {}; state.warnDismissed = false; $("warn-banner").classList.remove("visible");
      if (!restoreQueue || !state.queue.length) createQueue();
      state.queue = state.queue.filter(i => i >= 0 && i < state.videos.length);
      if (!state.queue.length) createQueue();
      if (state.queuePos >= state.queue.length) state.queuePos = 0;
      applyTitleCache(); updateStatus(); renderPlaylistSelect(); renderQueue(); renderNowPlaying(); schedulePersist();
      return true;
    }

    /* ── Saved playlists ────────────────────────────────── */
    function saveNamedPlaylist() {
      const name = $("save-name").value.trim(); if (!name) return;
      if (!state.videos.length) { showToast("Load a playlist before saving."); return; }
      if (state.playlists[name] && !window.confirm('Replace the saved playlist named "' + name + '"?')) return;
      state.playlists[name] = { videos: state.videos, url: state.playlistUrl || "" };
      state.playlistName = name; $("save-dialog").close(); renderPlaylistSelect(); updateStatus(); persist(); showToast('Saved "' + name + '"');
    }
    function loadNamedPlaylist(name) { const pl = state.playlists[name]; if (!pl) return; applyPlaylist(pl, name); playCurrent(true); fetchMissingTitles(); }
    function deleteNamedPlaylist() {
      const name = state.playlistName; if (!name || !state.playlists[name]) { showToast("That playlist is not in saved lists."); return; }
      if (!window.confirm('Delete saved playlist "' + name + '"?')) return;
      delete state.playlists[name]; persist(); renderPlaylistSelect(); showToast('Deleted "' + name + '"');
    }

    /* ── UI bindings ─────────────────────────────────────── */
    function bindUi() {
      $("btn-prev").onclick = playPrev; $("btn-next").onclick = playNext; $("btn-play").onclick = togglePlay;
      $("btn-shuffle").onclick = toggleShuffle;
      $("btn-loop").onclick = () => { state.loopCurrent = !state.loopCurrent; applyChrome(); renderQueue(); schedulePersist(); };
      $("btn-hide-gone").onclick = () => { state.hideGone = !state.hideGone; applyChrome(); renderQueue(); schedulePersist(); };
      $("btn-fullscreen").onclick = () => { const el = $("player-frame"); if (!document.fullscreenElement) el.requestFullscreen?.(); else document.exitFullscreen?.(); };
      $("btn-mute").onclick = toggleMute;
      $("btn-open-yt").onclick = () => { const v = currentVideo(); if (v) window.open(youtubeUrl(v.video_id), "_blank", "noopener"); };
      $("btn-delete-pl").onclick = deleteNamedPlaylist;
      $("btn-theme").onclick = toggleTheme;
      $("speed").onchange = ev => { state.playbackRate = Number(ev.target.value) || 1; applyPlaybackRate(); schedulePersist(); };
      $("volume").oninput = ev => setVolume(sliderToVolume(ev.target.value));
      $("progress").onmousedown = () => { state.seeking = true; };
      $("progress").onmouseup = () => { state.seeking = false; };
      $("progress").onchange = ev => { if (!state.duration) return; const t = (Number(ev.target.value) / 1000) * state.duration; state.currentTime = t; if (state.playerReady) state.player.seekTo(t, true); schedulePersist(); };
      $("search").oninput = ev => { state.search = ev.target.value; renderQueue(); };
      $("warn-dismiss").onclick = () => { state.warnDismissed = true; $("warn-banner").classList.remove("visible"); };
      $("btn-save-as").onclick = () => { $("save-name").value = state.playlistName || ""; $("save-dialog").showModal(); };
      $("save-cancel").onclick = () => $("save-dialog").close();
      $("save-ok").onclick = saveNamedPlaylist;
      $("playlist-select").onchange = ev => { if (ev.target.value !== "__current") loadNamedPlaylist(ev.target.value); };
      $("player-frame").addEventListener("click", () => { lockPlayerFocus(); togglePlay(); });
      document.addEventListener("keydown", ev => {
        const tag = ev.target.tagName; if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA" || ev.target.isContentEditable) return;
        const prev = ev.key === "F7" || ev.code === "F7" || ev.key === "MediaTrackPrevious";
        const next = ev.key === "F9" || ev.code === "F9" || ev.key === "MediaTrackNext";
        const play = ev.key === "F8" || ev.code === "F8" || ev.key === "MediaPlayPause" || ev.code === "Space";
        if (prev || next || play) { ev.preventDefault(); ev.stopPropagation(); lockPlayerFocus(); if (prev) playPrev(); if (next) playNext(); if (play) togglePlay(); return; }
        if (ev.key === "ArrowLeft") { ev.preventDefault(); seekBy(-10); }
        if (ev.key === "ArrowRight") { ev.preventDefault(); seekBy(10); }
        if (ev.key === "ArrowUp") { ev.preventDefault(); setVolume(state.volume + 5); }
        if (ev.key === "ArrowDown") { ev.preventDefault(); setVolume(state.volume - 5); }
        if (ev.key === "m" || ev.key === "M") { ev.preventDefault(); toggleMute(); }
        if (ev.key === "l" || ev.key === "L") { state.loopCurrent = !state.loopCurrent; applyChrome(); renderQueue(); schedulePersist(); }
        if (ev.key === "s" || ev.key === "S") toggleShuffle();
      }, true);
      window.addEventListener("beforeunload", persist);
    }

    window.onYouTubeIframeAPIReady = function () { ytApiReady = true; if (pendingVideoId || currentVideo()) playCurrent(true); };
    function init() {
      loadStore();
      loadTitleCache();
      forceTasklikeStart();
      bindUi();
      applyChrome();
      renderPlaylistSelect();
      restoreProgressUi();
      loadYouTubeApi();
      applyTitleCache();
      updateStatus();
      renderQueue();
      renderNowPlaying();
      showGoneWarning();
      playCurrent(true);
      fetchMissingTitles();
    }
    init();
  </script>
</body>
</html>
